name: E2E Tests

on:
  push:
    branches:
      - master
      - plus
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard:
          - data-validation
          - optimizer
          - team-rotations
          - calculator-core
          - plus

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: true # vendor/wuwa_calc backs /rankings (plus shard)

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests (${{ matrix.shard }})
        run: |
          npx vite dev &
          npx wait-on http://localhost:5173
          npm run cypress:run:${{ matrix.shard }}

      # Wuthering Tools+: keep the failure screenshots (the runner and the page at the moment a test failed), so a red
      # shard can be read after the runner is gone — the only trace a flake leaves (src/sim/README.md, "E2E gates")
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true # "Re-run failed jobs" uploads the same name again; v4 refuses that without it
