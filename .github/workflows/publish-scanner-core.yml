# Publishes packages/scanner-core to npm as @wutheringtools/scanner-core when its
# version in package.json changes on master (ADR 0034). Needs the NPM_TOKEN secret
# (an npm "automation" token for the wutheringtools account).
name: Publish scanner-core

on:
  push:
    branches: [master]
    paths:
      - "packages/scanner-core/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Check whether this version is already published
        id: check
        working-directory: packages/scanner-core
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@wutheringtools/scanner-core@${VERSION}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already on npm; nothing to do."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.check.outputs.publish == 'true'
        run: npx vitest run tests/scanner tests/echoes/parsedEchoMapping.test.ts
      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npx tsc -p packages/scanner-core/tsconfig.build.json
      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: packages/scanner-core
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
