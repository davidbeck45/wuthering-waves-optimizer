<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Wuthering Tools+ maskable home-screen icon (manifest "purpose": "maskable"): icon.svg's bars and plus on a
       full-bleed base, scaled so every stroke sits inside the safe circle (radius 0.4 × 512 around the centre) that
       round, squircle and teardrop launcher masks all keep. Render: rsvg-convert -w 512 icon-maskable.svg. -->
  <rect width="512" height="512" fill="#1d232a"/>
  <g transform="translate(256 256) scale(0.78) translate(-279 -256)">
    <g stroke="#a6adbb" stroke-width="30" stroke-linecap="round" fill="none">
      <path d="M118 400h276"/>
      <path d="M166 400V236"/>
      <path d="M256 400V128"/>
      <path d="M346 400V284"/>
    </g>
    <g stroke="#7480ff" stroke-width="30" stroke-linecap="round" fill="none">
      <path d="M394 112v92"/>
      <path d="M348 158h92"/>
    </g>
  </g>
</svg>
